# Compose usado pelo Dokploy (Compose path: ./docker-compose.dokploy.yml).
# Domínio e HTTPS são configurados na aba Domains do Dokploy (serviço "app", porta 3000).
# Variáveis vêm da aba Environment do Dokploy: POSTGRES_PASSWORD (obrigatória),
# POSTGRES_USER e POSTGRES_DB (opcionais).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rifa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no Dokploy}
      POSTGRES_DB: ${POSTGRES_DB:-minha_rifa}
    # Só no localhost da VPS: acesso pelo DBeaver via túnel SSH.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-rifa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-minha_rifa}
      DATA_DIR: /data
      # A app fica atrás do Traefik do Dokploy (1 proxy). Com Cloudflare em modo proxy na frente, use 2.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      APP_URL: ${APP_URL:-https://minharifa.victorlabs.cloud}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID no Dokploy}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?defina GOOGLE_CLIENT_SECRET no Dokploy}
    expose:
      - "3000"
    volumes:
      - uploads:/data
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
  uploads:
