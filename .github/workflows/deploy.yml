name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint:arch
      - run: npm run build

  deploy:
    name: Deploy na VPS
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'rifa' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'minha_rifa' }}
          APP_HOST_PORT: ${{ vars.APP_HOST_PORT || '3000' }}
          SHA: ${{ github.sha }}
        run: |
          {
            for v in DEPLOY_PATH SHA POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB APP_HOST_PORT; do
              printf 'export %s=%q\n' "$v" "${!v}"
            done
            cat <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          git fetch --prune origin main
          git reset --hard "$SHA"

          umask 077
          {
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'APP_HOST_PORT=%s\n' "$APP_HOST_PORT"
          } > .env

          export COMPOSE_PROJECT_NAME=minha-rifa
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          $COMPOSE build app
          $COMPOSE up -d db
          $COMPOSE run --rm -T app node apps/backend/dist/migrate.js up < /dev/null
          $COMPOSE up -d --remove-orphans

          docker image prune -f
          $COMPOSE ps
          EOF
          } | ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s'
