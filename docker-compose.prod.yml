# Override de produção. Uso na VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requer Docker Compose >= 2.24 (suporte a !reset).

services:
  db:
    # Banco só no localhost da VPS (acesso externo via túnel SSH, ex: DBeaver).
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  app:
    # App escuta só em localhost; o proxy reverso (Nginx/Caddy) da VPS faz o HTTPS na frente.
    ports: !override
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    environment:
      # Fotos privadas: o app só autoriza e o Nginx entrega o arquivo (location internal).
      PRIVATE_UPLOADS_ACCEL_PATH: /_private_uploads
    # Fotos numa pasta da VPS (public/ e private/), para o Nginx servir direto.
    # A pasta precisa existir com dono uid 1000 (usuário node do container).
    volumes: !override
      - "${UPLOADS_HOST_DIR:-/srv/minha-rifa/uploads}:/data/uploads"
