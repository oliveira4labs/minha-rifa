# Ambiente completo: Postgres + aplicação (backend servindo o front).
#
#   Só o banco (para desenvolver com `npm run dev`):  docker compose up -d db
#   Tudo (igual produção):                              docker compose up -d --build
#
# Variáveis podem ser sobrescritas num arquivo .env na raiz (veja .env.example).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rifa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rifa}
      POSTGRES_DB: ${POSTGRES_DB:-minha_rifa}
    ports:
      # 5433 no host para não conflitar com outro Postgres local na 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-rifa}:${POSTGRES_PASSWORD:-rifa}@db:5432/${POSTGRES_DB:-minha_rifa}
      DATA_DIR: /data
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    volumes:
      - uploads:/data

volumes:
  pgdata:
  uploads:
