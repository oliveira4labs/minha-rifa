<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciar rifa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="top"></div>
  <main class="wrap stack">
    <a href="/painel" class="small">← Minhas rifas</a>
    <div id="live" class="stack"><p class="empty">Carregando…</p></div>
    <details class="card" id="edit-card">
      <summary style="cursor:pointer;font-weight:700">Editar dados da rifa</summary>
      <form class="stack" id="edit-form" style="margin-top:16px"></form>
    </details>
  </main>
  <script src="/common.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    let s = null, getPhotos = null, formDirty = false;
    const publicUrl = () => `${location.origin}/r/${s.raffle.slug}`;
    const nums = (list) => list.map((n) => pad(n, s.raffle.total_numbers));

    function shareText() {
      const r = s.raffle, taken = new Set(s.taken.map((t) => t[0])), free = [];
      for (let n = 1; n <= r.total_numbers; n++) if (!taken.has(n)) free.push(n);
      return `🎟️ *${r.title}*\n${money(r.price_cents)} cada número` +
        (r.draw_date ? `\nSorteio: ${fmtDate(r.draw_date)}` : '') +
        (free.length ? `\n\nNúmeros disponíveis (${free.length}):\n${nums(free).join(', ')}` : '\n\nTodos os números já foram escolhidos!') +
        `\n\nEscolha o seu aqui: ${publicUrl()}`;
    }

    function orderHtml(o) {
      const total = money(o.numbers.length * s.raffle.price_cents);
      const pending = o.status === 'pending';
      const open = s.raffle.status === 'open';
      return `<div class="order ${o.status}">
        <div class="row between">
          <div><b>${esc(o.buyer_name)}</b> · <a href="${esc(waLink(o.buyer_phone))}" target="_blank" rel="noopener">${esc(fmtPhone(o.buyer_phone))}</a></div>
          <b class="num">${total}</b>
        </div>
        <div class="chips">${nums(o.numbers).map((n) => `<span class="chip">${n}</span>`).join('')}</div>
        <div class="row between">
          <span class="small muted">${pending ? `Reservado em ${fmtDate(o.created_at)} · expira em <span data-exp="${o.expires_at}">${countdown(o.expires_at - Date.now())}</span>` : `Pago — confirmado em ${fmtDate(o.paid_at)}`}</span>
          ${open ? `<span class="row">
            ${pending ? `<button class="btn sm danger" data-act="cancel" data-id="${o.id}">Recusar</button>
              <button class="btn sm primary" data-act="approve" data-id="${o.id}">Confirmar pagamento</button>`
              : `<button class="btn sm danger" data-act="cancel" data-id="${o.id}">Desfazer venda</button>`}
          </span>` : ''}
        </div>
      </div>`;
    }

    function drawHtml() {
      const r = s.raffle, c = s.counts;
      if (s.winner) {
        const w = s.winner;
        return `<div class="winner stack-sm"><p><b>Rifa sorteada</b> em ${fmtDate(w.drawn_at)}. Número ganhador:</p>
          <div class="big">${pad(w.number, r.total_numbers)}</div>
          <p><b>${esc(w.name)}</b> · ${esc(fmtPhone(w.phone))}</p>
          <div><a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(w.phone, `Parabéns, ${w.name}! Você ganhou a rifa "${r.title}" com o número ${pad(w.number, r.total_numbers)}! 🎉`))}">Avisar ganhador pelo WhatsApp</a></div></div>`;
      }
      const complete = c.paid === r.total_numbers;
      let status;
      if (complete) status = 'Todos os números estão pagos. Você já pode sortear.';
      else if (c.paid === 0) status = 'Ainda não há números pagos. O sorteio é feito entre os números com pagamento confirmado.';
      else if (s.can_draw) status = `A data do sorteio chegou e ${r.total_numbers - c.paid} número(s) ainda não foram pagos. Você pode adiar a data ou sortear entre os ${c.paid} números pagos.`;
      else if (r.draw_date) status = `O sorteio é liberado quando todos os números estiverem pagos ou a partir de ${fmtDate(r.draw_date)}.`;
      else status = 'O sorteio é liberado quando todos os números estiverem pagos. Para poder sortear antes disso, defina uma data do sorteio.';
      return `<section class="card stack">
        <h2>Sorteio</h2>
        <p class="${s.can_draw && !complete ? 'notice' : 'muted'}">${status}</p>
        <div class="row" style="align-items:flex-end">
          <label class="grow" style="min-width:200px">Data do sorteio
            <input type="datetime-local" id="draw-date" value="${toLocalInput(r.draw_date)}">
          </label>
          <button class="btn" id="save-date">Salvar data</button>
          <button class="btn primary" id="draw" ${s.can_draw ? '' : 'disabled'}>Realizar sorteio</button>
        </div>
      </section>`;
    }

    function renderLive() {
      // não redesenha enquanto a pessoa mexe no campo de data
      if (document.activeElement?.id === 'draw-date') return;
      const r = s.raffle, c = s.counts;
      document.title = `Gerenciar — ${r.title}`;
      const free = r.total_numbers - c.paid - c.pending;
      const pend = s.orders.filter((o) => o.status === 'pending'), paid = s.orders.filter((o) => o.status === 'paid');
      $('#live').innerHTML = `
        <div class="row between"><h1>${esc(r.title)}</h1>
          <span class="tag ${r.status === 'open' ? 'open' : 'done'}">${r.status === 'open' ? 'Aberta' : 'Sorteada'}</span></div>
        ${s.winner ? drawHtml() : ''}
        <section class="card stack">
          <h2>Divulgação</h2>
          <div class="pixbox"><code>${esc(publicUrl())}</code><button class="btn sm" id="copy-link">Copiar link</button>
            <a class="btn sm" href="${esc(publicUrl())}" target="_blank" rel="noopener">Abrir</a></div>
          ${r.status === 'open' ? `<div class="row">
            <button class="btn" id="copy-share">Copiar mensagem com números disponíveis</button>
            <a class="btn wa" id="wa-share" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareText())}">Enviar pelo WhatsApp</a>
          </div>` : ''}
          ${/^(localhost|127\.|\[::1\])/.test(location.host) ? '<p class="small muted">Este link só abre neste computador enquanto o sistema não estiver publicado na internet.</p>' : ''}
        </section>
        <div class="stats">
          <div class="stat"><b>${c.paid}</b><span>pagos</span></div>
          <div class="stat"><b>${c.pending}</b><span>aguardando confirmação</span></div>
          <div class="stat"><b>${free}</b><span>disponíveis</span></div>
          <div class="stat"><b>${money(c.paid * r.price_cents)}</b><span>arrecadado de ${money(r.total_numbers * r.price_cents)}</span></div>
        </div>
        ${s.winner ? '' : drawHtml()}
        <section class="stack-sm">
          <h2>Aguardando confirmação de pagamento (${pend.length})</h2>
          ${pend.length ? pend.map(orderHtml).join('') : '<p class="card empty">Nenhuma reserva pendente. Quando alguém reservar números, aparece aqui para você confirmar depois de receber o comprovante.</p>'}
        </section>
        <section class="stack-sm">
          <h2>Pagos (${paid.length})</h2>
          ${paid.length ? paid.map(orderHtml).join('') : '<p class="card empty">Nenhum pagamento confirmado ainda.</p>'}
        </section>`;
    }

    function renderForm() {
      const form = $('#edit-form');
      const locked = s.counts.paid + s.counts.pending > 0;
      $('#edit-card').classList.toggle('hidden', s.raffle.status !== 'open');
      form.innerHTML = raffleFormHtml(s.raffle, locked) + `<div class="row between">
        <button class="btn primary" type="submit">Salvar alterações</button>
        <button class="btn danger" type="button" id="delete">Excluir rifa</button></div>`;
      getPhotos = bindPhotos(form, s.photos);
      formDirty = false;
    }

    async function refresh(forceForm) {
      s = await api('GET', `/api/raffles/${id}`);
      renderLive();
      if (forceForm || (!formDirty && !$('#edit-card').open)) renderForm();
    }
    const run = async (fn) => { try { await fn(); } catch (e) { toast(e.message, true); refresh().catch(() => {}); } };
    const currentBody = (over) => ({ ...s.raffle, photos: s.photos.map((p) => ({ id: p.id })), ...over });

    $('#live').addEventListener('click', (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      if (t.id === 'copy-link') return copyText(publicUrl(), 'Link copiado!');
      if (t.id === 'copy-share') return copyText(shareText(), 'Mensagem copiada! Cole no WhatsApp.');
      if (t.id === 'save-date') return run(async () => {
        const v = $('#draw-date').value;
        document.activeElement?.blur();
        await api('PUT', `/api/raffles/${id}`, currentBody({ draw_date: v ? new Date(v).getTime() : null }));
        await refresh(true);
        toast(v ? 'Data do sorteio salva.' : 'Data do sorteio removida.');
      });
      if (t.id === 'draw') return run(async () => {
        const r = s.raffle, c = s.counts, complete = c.paid === r.total_numbers;
        const text = (complete
          ? `Todos os ${r.total_numbers} números estão pagos. O sistema vai sortear um deles agora.`
          : `Apenas ${c.paid} de ${r.total_numbers} números foram pagos. O sorteio será feito somente entre os ${c.paid} números pagos.` +
            (c.pending ? `\n${c.pending} número(s) reservado(s) sem pagamento confirmado ficarão de fora e serão cancelados.` : '')) +
          '\n\nDepois de sorteada, a rifa é encerrada e isso não pode ser desfeito.';
        if (!await confirmDialog({ title: 'Realizar o sorteio agora?', text, ok: 'Sortear agora' })) return;
        await api('POST', `/api/raffles/${id}/draw`);
        await refresh(true);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      const o = s.orders.find((x) => x.id === Number(t.dataset.id));
      if (!o) return;
      if (t.dataset.act === 'approve') return run(async () => {
        await api('POST', `/api/orders/${o.id}/approve`);
        await refresh();
        toast(`Pagamento de ${o.buyer_name} confirmado.`);
      });
      if (t.dataset.act === 'cancel') return run(async () => {
        const paid = o.status === 'paid';
        const ok = await confirmDialog({
          title: paid ? 'Desfazer esta venda?' : 'Recusar esta reserva?',
          text: `${nums(o.numbers).join(', ')} — ${o.buyer_name}\n\nOs números voltam a ficar disponíveis para outras pessoas.`,
          ok: paid ? 'Desfazer venda' : 'Recusar reserva', danger: true,
        });
        if (!ok) return;
        await api('POST', `/api/orders/${o.id}/cancel`);
        await refresh();
      });
    });

    $('#edit-form').addEventListener('input', () => { formDirty = true; });
    $('#edit-form').addEventListener('click', (e) => {
      if (e.target.closest('[data-photos]')) formDirty = true;
      if (e.target.id === 'delete') run(async () => {
        const ok = await confirmDialog({ title: 'Excluir esta rifa?', text: 'A rifa, as fotos e as reservas serão apagadas. Isso não pode ser desfeito.', ok: 'Excluir rifa', danger: true });
        if (!ok) return;
        await api('DELETE', `/api/raffles/${id}`);
        location.href = '/painel';
      });
    });
    $('#edit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      run(async () => {
        await api('PUT', `/api/raffles/${id}`, readRaffleForm(e.target, getPhotos));
        $('#edit-card').open = false;
        await refresh(true);
        toast('Alterações salvas.');
      });
    });

    setInterval(() => document.querySelectorAll('[data-exp]').forEach((el) => { el.textContent = countdown(Number(el.dataset.exp) - Date.now()); }), 1000);
    setInterval(() => { if (!document.querySelector('dialog[open]')) refresh().catch(() => {}); }, 15000);

    (async () => {
      const user = await requireUser();
      $('#top').innerHTML = topbar(user); bindLogout();
      try { await refresh(true); }
      catch (e) { $('#live').innerHTML = `<div class="card empty"><h2>${esc(e.message)}</h2></div>`; $('#edit-card').classList.add('hidden'); }
    })();
  </script>
</body>
</html>
