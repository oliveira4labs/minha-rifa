<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rifa</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><div><span class="brand">minha<span>rifa</span></span></div></header>
  <main class="wrap stack" id="app"><p class="empty">Carregando…</p></main>

  <div class="buybar hidden" id="buybar"><div>
    <div class="grow"><b id="buy-count"></b><div class="small muted num" id="buy-total"></div></div>
    <button class="btn" id="buy-clear">Limpar</button>
    <button class="btn primary" id="buy-go">Reservar</button>
  </div></div>

  <dialog id="buy-dialog">
    <form method="dialog" class="stack" id="buy-form">
      <h2>Reservar números</h2>
      <p class="muted small" id="buy-summary"></p>
      <label>Seu nome completo
        <input name="name" maxlength="80" required autocomplete="name">
      </label>
      <label>Seu WhatsApp (com DDD)
        <input name="phone" type="tel" inputmode="tel" required autocomplete="tel" placeholder="(11) 91234-5678">
      </label>
      <div class="actions">
        <button type="button" class="btn" id="buy-cancel">Voltar</button>
        <button type="submit" class="btn primary">Confirmar reserva</button>
      </div>
    </form>
  </dialog>

  <script src="/common.js"></script>
  <script>
    const slug = location.pathname.split('/').pop();
    const storeKey = `rifa:${slug}:pedidos`;
    const selected = new Set();
    let data = null, orders = [], photoIndex = 0, onlyFree = false;

    const loadTokens = () => { try { return JSON.parse(localStorage.getItem(storeKey)) || []; } catch { return []; } };
    const saveTokens = (t) => { try { localStorage.setItem(storeKey, JSON.stringify(t)); } catch { /* sem armazenamento */ } };

    async function refresh() {
      try {
        data = await api('GET', `/api/r/${slug}`);
      } catch (e) {
        if (!data) $('#app').innerHTML = `<div class="card empty"><h2>${esc(e.message)}</h2><p>Confira se o link está correto.</p></div>`;
        return;
      }
      const tokens = loadTokens();
      orders = (await Promise.all(tokens.map((t) => api('GET', `/api/pedido/${t}`).catch(() => null)))).filter(Boolean);
      // números escolhidos que outra pessoa pegou nesse meio tempo
      const taken = new Set(data.taken.map((t) => t[0]));
      const lost = [...selected].filter((n) => taken.has(n));
      if (lost.length) { lost.forEach((n) => selected.delete(n)); toast(`O número ${lost.join(', ')} acabou de ser reservado por outra pessoa.`, true); }
      render();
    }

    function orderHtml(o) {
      const r = data.raffle;
      const nums = o.numbers.map((n) => `<span class="chip">${pad(n, r.total_numbers)}</span>`).join('');
      if (o.status === 'paid') {
        return `<div class="order paid"><div class="row between"><b>Pagamento confirmado ✓</b><span class="tag open">Seus números</span></div>
          <div class="chips">${nums}</div><p class="small muted">Em nome de ${esc(o.buyer_name)}. Boa sorte!</p></div>`;
      }
      if (o.status === 'pending') {
        const list = o.numbers.map((n) => pad(n, r.total_numbers)).join(', ');
        const msg = `Olá! Reservei ${o.numbers.length > 1 ? 'os números' : 'o número'} ${list} da rifa "${r.title}" em nome de ${o.buyer_name}. Total: ${money(o.total_cents)}. Segue o comprovante do PIX.`;
        return `<div class="order pending">
          <div class="row between"><b>Aguardando pagamento</b><span class="tag pending">Reservado por <span data-exp="${o.expires_at}">${countdown(o.expires_at - Date.now())}</span></span></div>
          <div class="chips">${nums}</div>
          <p>Total: <b class="num">${money(o.total_cents)}</b></p>
          <div class="stack-sm">
            <span class="small"><b>1.</b> Pague com PIX usando a chave:</span>
            <div class="pixbox"><code>${esc(r.pix_key)}</code><button class="btn sm" data-copy="${esc(r.pix_key)}">Copiar</button></div>
            <span class="small"><b>2.</b> Envie o comprovante para o organizador confirmar:</span>
            <a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(r.whatsapp, msg))}">Enviar comprovante pelo WhatsApp</a>
          </div>
          <p class="small muted">Se o pagamento não for confirmado dentro do prazo, os números voltam a ficar disponíveis.</p>
        </div>`;
      }
      const why = o.status === 'expired' ? 'A reserva expirou' : 'A reserva foi cancelada';
      return `<div class="order"><div class="row between"><b>${why}</b><button class="btn sm" data-forget="${o.token}">Dispensar</button></div>
        <div class="chips">${nums}</div><p class="small muted">Esses números voltaram a ficar disponíveis.</p></div>`;
    }

    function render() {
      const r = data.raffle, total = r.total_numbers;
      document.title = r.title;
      const map = new Map(data.taken.map((t) => [t[0], t]));
      const paid = data.taken.filter((t) => t[1] === 'p').length;
      const pend = data.taken.length - paid;
      const free = total - data.taken.length;
      const open = r.status === 'open';
      if (photoIndex >= data.photos.length) photoIndex = 0;

      const gallery = data.photos.length ? `<div>
          <div class="gallery-main"><img id="main-photo" src="${esc(data.photos[photoIndex])}" alt="Foto do prêmio"></div>
          ${data.photos.length > 1 ? `<div class="gallery-thumbs">${data.photos.map((p, i) =>
            `<button data-photo="${i}" class="${i === photoIndex ? 'on' : ''}" aria-label="Ver foto ${i + 1}"><img src="${esc(p)}" alt=""></button>`).join('')}</div>` : ''}
        </div>` : '';

      const winner = data.winner ? `<div class="winner"><p><b>Rifa sorteada!</b> Número ganhador:</p>
          <div class="big">${pad(data.winner.number, total)}</div><p>${esc(data.winner.name)} 🎉</p></div>` : '';

      let cells = '';
      for (let n = 1; n <= total; n++) {
        const t = map.get(n);
        const cls = t ? (t[1] === 'p' ? 'paid' : 'res') : selected.has(n) ? 'sel' : '';
        const win = data.winner?.number === n ? ' win' : '';
        const label = t ? `${pad(n, total)} — ${t[1] === 'p' ? 'pago' : 'reservado'} por ${t[2]}` : `Número ${pad(n, total)}`;
        cells += `<button class="n ${cls}${win}" data-n="${n}" ${t ? 'aria-disabled="true"' : `aria-pressed="${selected.has(n)}"`} title="${esc(label)}">${pad(n, total)}</button>`;
      }

      $('#app').innerHTML = `
        ${winner}
        <section class="hero ${data.photos.length ? 'has-photos' : ''}">
          ${gallery}
          <div class="stack">
            <div class="stack-sm">
              <span><span class="tag ${open ? 'open' : 'done'}">${open ? 'Rifa aberta' : 'Rifa encerrada'}</span></span>
              <h1>${esc(r.title)}</h1>
            </div>
            <div><span class="price num">${money(r.price_cents)}</span> <span class="muted">por número</span></div>
            <div class="stack-sm">
              <div class="bar" role="img" aria-label="${paid} pagos, ${pend} reservados, ${free} disponíveis">
                <i style="width:${paid / total * 100}%"></i><i class="pend" style="width:${pend / total * 100}%"></i></div>
              <p class="small muted num"><b style="color:var(--ink)">${free}</b> de ${total} números disponíveis</p>
            </div>
            ${r.draw_date ? `<p class="small">🗓️ Sorteio previsto para <b>${fmtDate(r.draw_date)}</b></p>` : ''}
            ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ''}
          </div>
        </section>

        ${orders.length ? `<section class="stack-sm"><h2>Seus pedidos</h2>${orders.map(orderHtml).join('')}</section>` : ''}

        <section class="card stack">
          <div class="row between">
            <h2>${open ? 'Escolha seus números' : 'Números'}</h2>
            ${open ? `<label class="row small" style="font-weight:400;display:flex"><input type="checkbox" id="only-free" style="width:auto;min-height:0" ${onlyFree ? 'checked' : ''}> Mostrar só disponíveis</label>` : ''}
          </div>
          <div class="legend"><span>Disponível</span>${open ? '<span class="l-sel">Escolhido por você</span>' : ''}<span class="l-res">Reservado</span><span class="l-paid">Pago</span></div>
          <div class="numbers ${onlyFree ? 'only-free' : ''}" id="numbers">${cells}</div>
          ${open ? `<p class="small muted">Ao reservar, os números ficam guardados para você por ${fmtDuration(r.reserve_minutes)}, até o organizador confirmar o pagamento.${r.max_per_buyer ? ` Limite de ${r.max_per_buyer} número(s) por pessoa.` : ''}</p>` : ''}
        </section>`;
      renderBar();
    }

    function renderBar() {
      const n = selected.size;
      $('#buybar').classList.toggle('hidden', n === 0 || data.raffle.status !== 'open');
      $('#buy-count').textContent = `${n} número${n === 1 ? '' : 's'}`;
      $('#buy-total').textContent = money(n * data.raffle.price_cents);
    }

    $('#app').addEventListener('click', (e) => {
      const t = e.target.closest('[data-n],[data-photo],[data-copy],[data-forget]');
      if (!t) return;
      if (t.dataset.photo != null) { photoIndex = Number(t.dataset.photo); render(); return; }
      if (t.dataset.copy != null) { copyText(t.dataset.copy, 'Chave PIX copiada!'); return; }
      if (t.dataset.forget != null) { saveTokens(loadTokens().filter((x) => x !== t.dataset.forget)); orders = orders.filter((o) => o.token !== t.dataset.forget); render(); return; }
      const n = Number(t.dataset.n);
      if (t.getAttribute('aria-disabled')) { toast(t.title); return; }
      if (data.raffle.status !== 'open') return;
      if (selected.has(n)) selected.delete(n);
      else {
        const max = data.raffle.max_per_buyer;
        if (max && selected.size >= max) { toast(`Limite de ${max} número(s) por pessoa nesta rifa.`, true); return; }
        selected.add(n);
      }
      t.classList.toggle('sel', selected.has(n));
      t.setAttribute('aria-pressed', selected.has(n));
      renderBar();
    });
    $('#app').addEventListener('change', (e) => {
      if (e.target.id === 'only-free') { onlyFree = e.target.checked; $('#numbers').classList.toggle('only-free', onlyFree); }
    });

    $('#buy-clear').addEventListener('click', () => { selected.clear(); render(); });
    $('#buy-cancel').addEventListener('click', () => $('#buy-dialog').close());
    $('#buy-go').addEventListener('click', () => {
      const nums = [...selected].sort((a, b) => a - b);
      $('#buy-summary').textContent = `Números ${nums.map((n) => pad(n, data.raffle.total_numbers)).join(', ')} — total ${money(nums.length * data.raffle.price_cents)}`;
      const f = $('#buy-form');
      try { const me = JSON.parse(localStorage.getItem('rifa:comprador')) || {}; f.elements.name.value ||= me.name || ''; f.elements.phone.value ||= me.phone || ''; } catch { /* sem armazenamento */ }
      $('#buy-dialog').showModal();
    });
    $('#buy-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target, btn = f.querySelector('[type=submit]');
      btn.disabled = true;
      try {
        const { token } = await api('POST', `/api/r/${slug}/reserve`, { name: f.elements.name.value, phone: f.elements.phone.value, numbers: [...selected] });
        saveTokens([token, ...loadTokens()]);
        try { localStorage.setItem('rifa:comprador', JSON.stringify({ name: f.elements.name.value, phone: f.elements.phone.value })); } catch { /* sem armazenamento */ }
        selected.clear();
        $('#buy-dialog').close();
        await refresh();
        toast('Números reservados! Agora faça o pagamento.');
        document.querySelector('.order.pending')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (err) {
        toast(err.message, true);
        if (err.busy) { $('#buy-dialog').close(); await refresh(); }
      } finally { btn.disabled = false; }
    });

    // contagem regressiva das reservas e atualização periódica da grade
    setInterval(() => {
      let expired = false;
      document.querySelectorAll('[data-exp]').forEach((el) => {
        const left = Number(el.dataset.exp) - Date.now();
        el.textContent = countdown(left);
        if (left <= 0) expired = true;
      });
      if (expired) refresh();
    }, 1000);
    setInterval(() => { if (!$('#buy-dialog').open) refresh(); }, 20000);
    refresh();
  </script>
</body>
</html>
